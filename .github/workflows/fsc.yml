name: Fuel surcharge check

on:
  schedule:
    # 13:00 UTC = 06:00 Pacific (PDT) / 05:00 (PST). Carriers post Monday changes
    # a few days ahead, so a daily check catches every move without hammering them.
    - cron: '0 13 * * *'
  workflow_dispatch:        # lets you run it on demand from the Actions tab
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Get-FuelSurcharges.ps1'
      - 'Get-FuelTrend.ps1'
      - 'data/ace-fsc-history.json'
      - '.github/workflows/fsc.yml'
      # Pushed each morning by the office PC; republish so its rows go live.
      - 'data/local-public.json'

permissions:
  contents: write           # commit refreshed data back to the repo
  pages: write              # publish the dashboard
  id-token: write

concurrency:
  group: fsc
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape carrier fuel surcharges
        shell: pwsh
        # Some carrier sites block GitHub's servers. For any carrier that fails here, use the rows
        # the office PC published, as long as those rates are still in effect.
        run: ./Get-FuelSurcharges.ps1 -Verbose -FallbackSnapshot data/local-public.json

      - name: Build diesel vs ACE surcharge trend
        shell: pwsh
        run: ./Get-FuelTrend.ps1

      - name: Commit any rate changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Public files only. data/latest.json and site/data.js hold internal notes
          # and are gitignored.
          git add data/history.jsonl site/latest.json site/trend.json data/ace-fsc-history.json
          if git diff --staged --quiet; then
            echo "No rate changes today."
          else
            git commit -m "FSC update $(date -u +%Y-%m-%d)"
            # The office PC may have pushed while this ran.
            git pull --rebase --quiet origin main
            git push
          fi

      - name: Assemble the public site
        # Allowlist: publish exactly these files and nothing else from the repo.
        run: |
          mkdir -p _site
          cp site/index.html site/latest.json site/trend.json _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
